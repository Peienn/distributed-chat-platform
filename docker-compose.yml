services:
  nginx:
    image: nginx:latest
    container_name: my-nginx
    ports:
      - "80:8080"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - tech-showcase-net


  backend:
    image: node:20
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm run dev"
    expose:
      - "3000"   # 只給內部（nginx）用
    depends_on:
      - my-postgres
      - my-redis
    networks:
     - tech-showcase-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 5s
      retries: 5


  python-analysis:
      build:
        context: ./Python_aiAnalysis
      container_name: python-analysis
      depends_on:
        backend:
          condition: service_started    # backend 沒有 healthcheck，用 started 就好
        my-redis:
          condition: service_healthy    # ✅ 等 redis ready
        my-postgres:
          condition: service_healthy    # ✅ 等 postgres ready
      networks:
        - tech-showcase-net
      volumes:
        - ./Python_aiAnalysis:/app
      command: python -u consumer.py



  my-postgres:
    image: postgres:17
    container_name: my-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ChatRoom
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_user
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tech-showcase-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d ChatRoom"]
      interval: 5s
      timeout: 5s
      retries: 5

  my-redis:
    image: redis:latest
    container_name: my-redis
    ports:
      - "6379:6379"
    networks:
      - tech-showcase-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # =========================
  #  Monitoring (新增)
  # =========================

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - tech-showcase-net

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3005:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - tech-showcase-net
    environment:
      # 啟用 SMTP
      - GF_SMTP_ENABLED=true
      # Gmail SMTP
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER= #your gmail
      - GF_SMTP_PASSWORD= # your gmail application password

      # 寄件者名稱與地址
      - GF_SMTP_FROM_ADDRESS= # your gmail
      - GF_SMTP_FROM_NAME=Grafana

  # =========================
  # Exporters
  # =========================
  
  redis-exporter:
    image: oliver006/redis_exporter
    container_name: redis-exporter
    environment:
      REDIS_ADDR: redis://my-redis:6379
    ports:
      - "9121:9121"
    networks:
      - tech-showcase-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://chat_user:chat_user@my-postgres:5432/ChatRoom?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - tech-showcase-net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - -nginx.scrape-uri=http://my-nginx:8080/nginx_status
    ports:
      - "9113:9113"
    networks:
      - tech-showcase-net

  # ── ELK Stack ────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - tech-showcase-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    mem_limit: 512m
    volumes:
      - ./ELK/logstash/pipeline:/usr/share/logstash/pipeline
    networks:
      - tech-showcase-net
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - tech-showcase-net
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: filebeat
    user: root
    volumes:
      - ./ELK/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # 掛載 Docker socket 讀取所有 container logs
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash
    networks:
      - tech-showcase-net




networks:
  tech-showcase-net:
    driver: bridge

volumes:
  prometheus-data:
  pgdata:
  grafana-data:
  esdata:
