# .github/workflows/deploy.yml
name: EC2 Deploy Test

# 觸發條件：每次 push 到 main 分支
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 取得 repo code（Actions runner 自己用）
      - name: Checkout repo
        uses: actions/checkout@v3

      # Step 2: 設定 SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # Step 3: SSH 到 EC2 並部署
      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            # ✅ 用 ${{ github.repository }} 讓 Runner 展開
            PROJECT_DIR=/home/ubuntu/${{ github.event.repository.name }}
            echo "Project Name : $PROJECT_DIR"

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Repo not found, cloning..."
              # ✅ public repo 不需要 token
              git clone https://github.com/${{ github.repository }}.git $PROJECT_DIR
            fi

            ls 

            cd $PROJECT_DIR

            
            git pull origin main
            docker-compose down
            docker-compose up -d --build --scale backend=2
            echo "Deployment finished!"
          EOF
